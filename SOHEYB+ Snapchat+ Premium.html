<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOHEYB+ | Snapchat+ Premium</title>
<style>
:root{--bg:#02040c;--g1:rgba(22,30,56,.55);--g2:rgba(255,255,255,.13);--sep:rgba(255,255,255,.1);--t:#fff;--t2:rgba(235,235,245,.6);--blue:#0a84ff;--gold:#ffd60a;--green:#30d158;--ease:cubic-bezier(.32,.72,0,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","SF Arabic","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 70% at 50% -5%,#0f2f73 0%,#060e26 50%,#02040c 100%)}
.bgfx i{position:absolute;border-radius:50%;filter:blur(70px);animation:fl 14s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:300px;height:300px;background:#0a84ff;top:-90px;right:-90px;opacity:.5}
.bgfx i:nth-child(2){width:260px;height:260px;background:#7d3cff;top:45%;left:-120px;opacity:.35;animation-delay:-5s}
.bgfx i:nth-child(3){width:280px;height:280px;background:#00c2ff;bottom:-110px;right:-60px;opacity:.3;animation-delay:-9s}
.bgfx::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:linear-gradient(#000,transparent 75%);mask-image:linear-gradient(#000,transparent 75%)}
@keyframes fl{to{transform:translate(30px,-40px) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:22px 18px 150px}
.glass{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{text-align:center;animation:up .7s var(--ease) both}
.logo{width:92px;height:92px;border-radius:24px;box-shadow:0 10px 30px rgba(10,132,255,.4),0 0 0 .5px rgba(255,255,255,.2);display:block;margin:6px auto 14px}
.hero h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;direction:ltr}
.hero h1 b{color:var(--blue)}
.hero p{margin:4px 0 0;color:var(--t2);font-size:15px;direction:ltr;font-weight:500}
.sec{margin-top:26px;animation:up .7s .08s var(--ease) both}
.cap{font-size:13px;color:var(--t2);margin:0 8px 8px;font-weight:600}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--g1);border-radius:14px;padding:3px;direction:ltr}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--g2);border-radius:11px;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .45s var(--ease)}
.seg[data-v=iphone] i{transform:translateX(100%)}
.seg button{position:relative;z-index:1;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600;color:var(--t2);transition:color .3s}
.seg button.on{color:var(--t)}
.wheel{position:relative;height:240px;border-radius:26px;background:var(--g1);overflow:hidden}
.wheel::before{content:"";position:absolute;left:12px;right:12px;top:86px;height:68px;border-radius:18px;background:rgba(10,132,255,.18);box-shadow:inset 0 0 0 1.5px rgba(10,132,255,.7),0 0 24px rgba(10,132,255,.25)}
.wheel::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(#050b1e 0%,rgba(5,11,30,0) 32%,rgba(5,11,30,0) 68%,#050b1e 100%)}
.scroll{position:absolute;inset:0;z-index:1;overflow-y:auto;scroll-snap-type:y mandatory;padding:86px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.it{height:68px;width:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:space-between;padding:0 32px;cursor:pointer;will-change:transform,opacity}
.it .n{font-size:21px;font-weight:600;display:flex;align-items:center;gap:10px}
.it .p{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:4px;transition:color .25s}
.it .p small{font-size:13px;color:var(--t2);font-weight:600}
.it.on .p{color:var(--blue)}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--gold);color:#000;font-size:11.5px;font-weight:700;padding:3px 9px 3px 7px;border-radius:99px}
.na{display:none;background:var(--g1);border-radius:24px;padding:36px 22px;text-align:center}
.na .ic{width:64px;height:64px;border-radius:50%;background:rgba(255,69,58,.15);display:grid;place-items:center;margin:0 auto 14px}
.na h3{margin:0 0 6px;font-size:21px}
.na p{margin:0;color:var(--t2);font-size:15px;line-height:1.7}
body.droid .wheel,body.droid .after{display:none}
body.droid .na{display:block;animation:up .5s var(--ease) both}
.list{background:var(--g1);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:right;position:relative;transition:background .2s}
.row+.row::before{content:"";position:absolute;top:0;right:16px;left:0;height:.5px;background:var(--sep)}
.row:active{background:var(--g2)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.row .tx{flex:1;font-size:17px;font-weight:600}
.row .tx small{display:block;font-size:13px;color:var(--t2);font-weight:500;margin-top:1px}
.tag{background:rgba(48,209,88,.18);color:var(--green);font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;margin-inline-start:6px;direction:ltr;display:inline-block}
.rd{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--t2);opacity:.6;display:grid;place-items:center;transition:.3s var(--ease);flex:none}
.rd svg{width:12px;height:12px;opacity:0;transform:scale(.4);transition:.3s var(--ease)}
.row.on .rd{background:var(--blue);border-color:var(--blue);opacity:1}
.row.on .rd svg{opacity:1;transform:none}
.sum{background:var(--g1);border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px}
.sum .ico{background:rgba(10,132,255,.15);width:52px;height:52px}
.sum .v{font-size:34px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;line-height:1.15}
.sum .v small{font-size:17px;margin-inline-start:4px}
.sum .nt{font-size:12.5px;color:var(--t2);min-height:17px}
.safe{text-align:center;margin-top:26px;color:var(--t2);font-size:14px;line-height:1.8}
.safe b{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--t);font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(2,4,12,.6);backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);border-top:.5px solid var(--sep);z-index:5}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:444px;margin:0 auto;height:56px;border-radius:18px;background:#25d366;color:#fff;font-size:18px;font-weight:700;box-shadow:0 8px 24px rgba(37,211,102,.35);transition:transform .3s var(--ease),opacity .3s,filter .3s}
.go:active{transform:scale(.97)}
.go[disabled]{filter:grayscale(1);opacity:.35;pointer-events:none;box-shadow:none}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-140%);background:#2c2c2e;color:#fff;padding:12px 20px;border-radius:99px;font-size:15px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .5s var(--ease);z-index:9;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
</style>
</head>

      <button data-os="android"><svg width="22" height="22" viewBox="0 0 24 24" fill="#3ddc84"><path d="M17.5 9.5a5.5 5.5 0 0 0-11 0z"/><path d="M6.5 10.5h11v7a1.5 1.5 0 0 1-1.5 1.5H15v2.2a1.1 1.1 0 0 1-2.2 0V19h-1.6v2.2a1.1 1.1 0 0 1-2.2 0V19H8a1.5 1.5 0 0 1-1.5-1.5zM4 10.7a1.1 1.1 0 0 1 2.2 0v5.6a1.1 1.1 0 0 1-2.2 0zM17.8 10.7a1.1 1.1 0 0 1 2.2 0v5.6a1.1 1.1 0 0 1-2.2 0z"/></svg>Android</button>
      <button class="on" data-os="iphone"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.4 2-3.5 2.1-3.6-1.2-1.7-3-1.9-3.6-1.9-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.200 2.500-1.800 3.100-.5 7.700 1.300 10.200.9 1.200 1.900 2.600 3.200 2.500 1.300-.1 1.800-.8 3.300-.8s2 .8 3.300.8 2.200-1.200 3.100-2.400c1-1.400 1.400-2.800 1.400-2.900-.1 0-2.800-1.100-2.800-4.400zM13.900 5.200c.7-.9 1.200-2 1-3.200-1 .1-2.300.7-3 1.600-.7.700-1.200 1.900-1.100 3 1.200.1 2.400-.5 3.100-1.400z"/></svg>iPhone</button>
    </div>
  </div>

  <div class="sec">
    <p class="cap">مدة الاشتراك</p>
    <div class="wheel glass"><div class="scroll" id="plans"></div></div>
    <div class="na glass">
      <div class="ic"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ff453a" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5.5M12 16.3v.2"/></svg></div>
      <h3>العروض غير متوفرة حالياً</h3>
      <p>عروض أندرويد غير متاحة في الوقت الحالي.<br>اختر iPhone لعرض الأسعار والاشتراك.</p>
    </div>
  </div>

  <div class="after">
    <div class="sec">
      <p class="cap">السعر الإجمالي</p>
      <div class="sum glass">
        <div class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0a84ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4M14 3l5 5v3M14 3v5h5M8 12h5M8 16h2"/><circle cx="17.5" cy="17.5" r="4.5"/><path d="M17.5 15.3v4.4M18.7 16.3h-1.8a.8.8 0 0 0 0 1.6h1.2a.8.8 0 0 1 0 1.6h-1.8"/></svg></div>
        <div><div class="v"><span id="total">2,700</span><small>دج</small></div><div class="nt" id="note"></div></div>
      </div>
    </div>
    <div class="sec">
      <p class="cap">طريقة الدفع</p>
      <div class="list glass" id="pay"></div>
    </div>
  </div>

  <div class="safe"><b><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>اشتراك رسمي وآمن 100%</b>يتم تفعيل اشتراكك مباشرة بعد إتمام الطلب</div>
</div>

<div class="bar"><button class="go" id="go">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.7-5A9 9 0 1 1 8 19.3z"/><path d="M9 9c0 3.5 2.5 6 6 6l1.2-1.7-2-1-1 .7c-.8-.4-1.6-1.2-2-2l.7-1-1-2z" fill="#fff" stroke="none"/></svg>اطلب الآن عبر واتساب</button></div>

<script>
const RATE=.15,PHONE='213784287459',IH=68;
const plans=[{t:'شهر',p:600},{t:'شهرين',p:800},{t:'4 أشهر',p:1200},{t:'5 أشهر',p:1600},{t:'سنة',p:2400},{t:'سنتين',p:2700,best:1}];
const cardI='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1c1c1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/></svg>';
const phoneI='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="3"/><path d="M10.5 18.5h3M9.5 10.5l2 2 3.5-4"/></svg>';
const pays=[
 {k:'flexy',n:'Flexy',s:'فليكسي',extra:'+15%',c:'#0a84ff',i:'<span style="color:#fff;font-weight:800;font-size:21px">F</span>'},
 {k:'baridi',n:'BaridiMob',s:'بريدي موب',c:'#5e5ce6',i:phoneI},
 {k:'ccp',n:'CCP',s:'بريد الجزائر',c:'#ffcc00',i:cardI}];
let plan=plans[5],pay=pays[0],os='iphone',shown=2700;
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('en-US');
const ck='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l5 5L20 7"/></svg>';
const star='<svg width="12" height="12" viewBox="0 0 24 24" fill="#000"><path d="M12 2l3 7 7 .6-5.3 4.8 1.6 7.1L12 17.8 5.7 21.5l1.6-7.100L2 9.6 9 9z"/></svg>';
const price=()=>pay.k==='flexy'?plan.p*(1+RATE):plan.p;
function count(to){const from=shown,t0=performance.now();shown=to;(function f(t){const k=Math.min(1,(t-t0)/450),e=1-Math.pow(1-k,3);$('total').textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0)}
function render(){
 $('pay').innerHTML=pays.map(x=>`<button class="row ${x===pay?'on':''}" data-k="${x.k}"><span class="ico" style="background:${x.c}">${x.i}</span><span class="tx">${x.n}${x.extra?`<span class="tag">${x.extra}</span>`:''}<small>${x.s}</small></span><span class="rd">${ck}</span></button>`).join('');
 $('note').textContent=pay.k==='flexy'?`${fmt(plan.p)} دج + 15% رسوم فليكسي`:'';
 count(price());
}
const sc=$('plans');
sc.innerHTML=plans.map((x,i)=>`<div class="it" data-i="${i}"><span class="n">${x.t}${x.best?`<span class="badge">${star}العرض المميز</span>`:''}</span><span class="p">${fmt(x.p)}<small>دج</small></span></div>`).join('');
const its=[...sc.children];let raf;
function wheel(){
 const y=sc.scrollTop/IH;
 its.forEach((el,i)=>{const d=i-y,a=Math.min(Math.abs(d),3);el.style.transform=`perspective(450px) rotateX(${-Math.max(-3,Math.min(3,d))*30}deg) scale(${1-a*.1})`;el.style.opacity=Math.max(0,1-a*.4)});
 const i=Math.max(0,Math.min(plans.length-1,Math.round(y)));
 if(plans[i]!==plan){plan=plans[i];its.forEach((el,j)=>el.classList.toggle('on',j===i));navigator.vibrate&&navigator.vibrate(6);render()}
}
sc.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(wheel)},{passive:true});
its.forEach(el=>el.onclick=()=>sc.scrollTo({top:el.dataset.i*IH,behavior:'smooth'}));
$('pay').onclick=e=>{const b=e.target.closest('[data-k]');if(b){pay=pays.find(x=>x.k===b.dataset.k);render()}};
let tt;
$('seg').onclick=e=>{const b=e.target.closest('[data-os]');if(!b)return;os=b.dataset.os;
 $('seg').dataset.v=os;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));
 document.body.classList.toggle('droid',os==='android');$('go').disabled=os==='android';
 if(os==='android'){$('toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('on'),2600)}
 else{$('toast').classList.remove('on');sc.scrollTop=plans.indexOf(plan)*IH;wheel()}};
$('go').onclick=()=>{if(os==='android')return;
 const m=`مرحباً، أريد طلب اشتراك Snapchat+ Premium\nالجهاز: iPhone\nالمدة: ${plan.t}\nطريقة الدفع: ${pay.n}${pay.extra?' ('+pay.extra+')':''}\nالسعر الإجمالي: ${fmt(price())} دج`;
 window.open('https://wa.me/'+PHONE+'?text='+encodeURIComponent(m),'_blank')};
render();
sc.scrollTop=5*IH;its[5].classList.add('on');wheel();
</script>
</body>
